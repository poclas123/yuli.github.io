<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Ti - Flor de Luz</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #030308;
            color: #ffffff;
            overflow-x: hidden;
        }

        .font-serif-magic {
            font-family: 'Great Vibes', cursive;
        }

        /* Aura de luz detrás de la flor */
        .glow-aura {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(255,105,180,0.4) 0%, rgba(236,72,153,0.2) 40%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            filter: blur(30px);
            transition: all 1.8s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
            z-index: 1;
        }

        /* Aura expandida tras el clic */
        .glow-aura.expanded {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255,182,193,0.6) 0%, rgba(244,114,182,0.35) 45%, rgba(139,92,246,0.15) 70%, rgba(0,0,0,0) 85%);
            filter: blur(45px);
            animation: pulse-glow 4s infinite alternate ease-in-out;
        }

        @keyframes pulse-glow {
            0% { transform: translate(-50%, -50%) scale(0.95); opacity: 0.85; }
            100% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
        }

        /* Estilos del contenedor de la flor */
        .flower-container {
            position: relative;
            z-index: 2;
            transform-origin: bottom center;
            transition: transform 0.5s ease;
        }

        /* Animación del viento */
        .swaying-wind {
            animation: sway 5s ease-in-out infinite alternate;
        }

        @keyframes sway {
            0% {
                transform: rotate(0deg) skewX(0deg);
            }
            30% {
                transform: rotate(3deg) skewX(1deg);
            }
            60% {
                transform: rotate(-2.5deg) skewX(-1deg);
            }
            100% {
                transform: rotate(4deg) skewX(1.5deg);
            }
        }

        /* Botón Mágico con Neomorfismo / Resplandor */
        .btn-magic {
            background: linear-gradient(135deg, #ec4899 0%, #db2777 50%, #9333ea 100%);
            box-shadow: 0 0 20px rgba(236, 72, 153, 0.4), inset 0 1px 1px rgba(255,255,255,0.4);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn-magic:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 0 35px rgba(236, 72, 153, 0.7), inset 0 1px 1px rgba(255,255,255,0.6);
        }

        .btn-magic:active {
            transform: translateY(1deg) scale(0.98);
        }

        /* Tarjeta del mensaje flotante */
        .message-card {
            background: rgba(18, 12, 28, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(244, 114, 182, 0.3);
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 30px rgba(236, 72, 153, 0.25);
            opacity: 0;
            transform: translateY(30px) scale(0.95);
            pointer-events: none;
            transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .message-card.show {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        /* Canvas de estrellas de fondo */
        #starsCanvas, #petalParticles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #starsCanvas { z-index: 0; }
        #petalParticles { z-index: 3; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center relative p-4 selection:bg-pink-500 selection:text-white">

    <canvas id="starsCanvas"></canvas>
    <canvas id="petalParticles"></canvas>

    <!-- Header sutil -->
    <header class="z-10 pt-6 text-center">
        <span class="text-xs uppercase tracking-widest text-pink-300/60 font-semibold">Un detalle especial</span>
    </header>

    <main class="w-full max-w-4xl flex flex-col items-center justify-center relative my-auto py-8">
        
        <!-- Luz de fondo radiante -->
        <div id="glowAura" class="glow-aura"></div>

        <!-- Contenedor SVG de la Flor Rosada -->
        <div id="flowerContainer" class="flower-container my-4 cursor-pointer" title="Haz clic en el botón para activar la brisa">
            <svg width="240" height="340" viewBox="0 0 240 340" fill="none" xmlns="http://www.w3.org/2000/svg" class="drop-shadow-[0_10px_15px_rgba(0,0,0,0.5)]">
                <!-- Tallo -->
                <path d="M120 330 Q 120 230 118 160" stroke="url(#stemGradient)" stroke-width="6" stroke-linecap="round" />
                
                <!-- Hoja Izquierda -->
                <path d="M119 260 C 80 250 60 210 50 200 C 70 210 100 225 119 240 Z" fill="url(#leafGradientLeft)" opacity="0.9"/>
                <!-- Venas hoja izquierda -->
                <path d="M119 240 Q 85 225 50 200" stroke="#15803d" stroke-width="1" opacity="0.4" />

                <!-- Hoja Derecha -->
                <path d="M119 230 C 160 220 180 180 190 170 C 170 180 140 195 119 210 Z" fill="url(#leafGradientRight)" opacity="0.9"/>
                <!-- Venas hoja derecha -->
                <path d="M119 210 Q 155 195 190 170" stroke="#15803d" stroke-width="1" opacity="0.4" />

                <!-- Sepalo / Base de la flor -->
                <path d="M102 165 C 105 180 135 180 138 165 C 140 150 100 150 102 165 Z" fill="#22c55e" />

                <!-- GRUPO PÉTALOS ROSADOS -->
                <g id="flowerPetals">
                    <!-- Pétalos exteriores de atrás -->
                    <path d="M120 160 C 60 140 40 70 85 50 C 110 80 115 130 120 160 Z" fill="url(#pinkPetalBackLeft)" />
                    <path d="M120 160 C 180 140 200 70 155 50 C 130 80 125 130 120 160 Z" fill="url(#pinkPetalBackRight)" />

                    <!-- Pétalos laterales -->
                    <path d="M120 162 C 50 120 55 40 100 30 C 115 65 118 120 120 162 Z" fill="url(#pinkPetalMidLeft)" />
                    <path d="M120 162 C 190 120 185 40 140 30 C 125 65 122 120 120 162 Z" fill="url(#pinkPetalMidRight)" />

                    <!-- Pétalo central / Capullo principal -->
                    <path d="M120 165 C 80 130 85 20 120 15 C 155 20 160 130 120 165 Z" fill="url(#pinkPetalCenter)" />

                    <!-- Pétalo frontal envolvente -->
                    <path d="M92 110 C 90 160 150 160 148 110 C 155 145 85 145 92 110 Z" fill="url(#pinkPetalFront)" opacity="0.95"/>
                    
                    <!-- Brillos y luces internas en los pétalos -->
                    <path d="M120 25 C 130 35 135 70 128 110" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.3" />
                    <path d="M98 50 C 90 70 92 100 102 125" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.25" />
                </g>

                <!-- Defs: Gradientes de color de alta calidad -->
                <defs>
                    <!-- Tallo -->
                    <linearGradient id="stemGradient" x1="0" y1="0" x2="1" y2="0">
                        <stop offset="0%" stop-color="#15803d" />
                        <stop offset="50%" stop-color="#22c55e" />
                        <stop offset="100%" stop-color="#166534" />
                    </linearGradient>

                    <!-- Hojas -->
                    <linearGradient id="leafGradientLeft" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#4ade80" />
                        <stop offset="100%" stop-color="#15803d" />
                    </linearGradient>
                    <linearGradient id="leafGradientRight" x1="1" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#4ade80" />
                        <stop offset="100%" stop-color="#15803d" />
                    </linearGradient>

                    <!-- Pétalos Rosados con matices elegantes -->
                    <linearGradient id="pinkPetalCenter" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#f472b6" />
                        <stop offset="50%" stop-color="#ec4899" />
                        <stop offset="100%" stop-color="#9d174d" />
                    </linearGradient>

                    <linearGradient id="pinkPetalMidLeft" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#fbcfe8" />
                        <stop offset="60%" stop-color="#f472b6" />
                        <stop offset="100%" stop-color="#be185d" />
                    </linearGradient>

                    <linearGradient id="pinkPetalMidRight" x1="1" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#fbcfe8" />
                        <stop offset="60%" stop-color="#f472b6" />
                        <stop offset="100%" stop-color="#be185d" />
                    </linearGradient>

                    <linearGradient id="pinkPetalBackLeft" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#f472b6" />
                        <stop offset="100%" stop-color="#831843" />
                    </linearGradient>

                    <linearGradient id="pinkPetalBackRight" x1="1" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#f472b6" />
                        <stop offset="100%" stop-color="#831843" />
                    </linearGradient>

                    <linearGradient id="pinkPetalFront" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#fce7f3" />
                        <stop offset="50%" stop-color="#f472b6" />
                        <stop offset="100%" stop-color="#db2777" />
                    </linearGradient>
                </defs>
            </svg>
        </div>

        <div class="mt-8 z-10">
            <button id="actionBtn" class="btn-magic px-8 py-4 rounded-full text-white font-semibold tracking-wide text-lg flex items-center space-x-3 group cursor-pointer focus:outline-none">
                <i class="fa-solid fa-wand-magic-sparkles text-pink-200 group-hover:rotate-12 transition-transform duration-300"></i>
                <span>Presióname</span>
                <i class="fa-solid fa-heart text-pink-200 text-sm opacity-80 group-hover:scale-125 transition-transform duration-300"></i>
            </button>
        </div>

        <div id="messageCard" class="message-card mt-8 p-6 sm:p-8 rounded-2xl max-w-lg text-center z-20 mx-4">
            <div class="text-pink-300 text-2xl mb-2">
                <i class="fa-solid fa-quote-left opacity-50"></i>
            </div>
            <p class="font-serif-magic text-3xl sm:text-4xl text-pink-100 leading-relaxed drop-shadow-md">
                "Esfuérzate al máximo niña y disfruta siempre de lo que haces, y pela bien las papas xd "
            </p>
            <div class="mt-4 flex justify-center items-center space-x-2 text-pink-300/80 text-xs tracking-widest uppercase">
                <span class="h-px w-8 bg-pink-400/30"></span>
                <span>Florece a tu ritmo</span>
                <span class="h-px w-8 bg-pink-400/30"></span>
            </div>
        </div>

    </main>


    <!-- Audio Web API Synth para sonido suave opcional al presionar -->
    <script>

        // Elementos del DOM
        const actionBtn = document.getElementById('actionBtn');
        const glowAura = document.getElementById('glowAura');
        const flowerContainer = document.getElementById('flowerContainer');
        const messageCard = document.getElementById('messageCard');

        let isActivated = false;

        // Reproductor de tono musical suave (Web Audio API - Sin archivos externos)
        function playMagicSound() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();

                // Acorde arpegiado suave (C Mágico: C5, E5, G5, B5, C6)
                const freqs = [523.25, 659.25, 783.99, 987.77, 1046.50];
                
                freqs.forEach((freq, index) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, ctx.currentTime + index * 0.12);

                    gain.gain.setValueAtTime(0, ctx.currentTime + index * 0.12);
                    gain.gain.linearRampToValueAtTime(0.08, ctx.currentTime + index * 0.12 + 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + index * 0.12 + 1.8);

                    osc.connect(gain);
                    gain.connect(ctx.destination);

                    osc.start(ctx.currentTime + index * 0.12);
                    osc.stop(ctx.currentTime + index * 0.12 + 2);
                });
            } catch (e) {
                console.log("Audio no soportado o bloqueado por el navegador.");
            }
        }

        actionBtn.addEventListener('click', () => {
            // Reproducir sonido ambiental mágico
            playMagicSound();

            // 1. Expandir la luz brillante de fondo
            glowAura.classList.add('expanded');

            // 2. Activar la animación de viento en la flor
            flowerContainer.classList.add('swaying-wind');

            // 3. Mostrar la tarjeta con el mensaje poético
            messageCard.classList.add('show');

            // 4. Emitir ráfaga de pétalos/partículas mágicas
            createPetalBurst();

            // Cambiar texto e icono del botón
            actionBtn.innerHTML = `
                <i class="fa-solid fa-sparkles text-pink-200"></i>
                <span>¡Sigue Brillando!</span>
                <i class="fa-solid fa-heart text-pink-200 text-sm"></i>
            `;

            isActivated = true;
        });

        const starsCanvas = document.getElementById('starsCanvas');
        const starsCtx = starsCanvas.getContext('2d');

        let stars = [];
        const numStars = 120;

        function resizeCanvas() {
            starsCanvas.width = window.innerWidth;
            starsCanvas.height = window.innerHeight;
            particlesCanvas.width = window.innerWidth;
            particlesCanvas.height = window.innerHeight;
            initStars();
        }

        function initStars() {
            stars = [];
            for (let i = 0; i < numStars; i++) {
                stars.push({
                    x: Math.random() * starsCanvas.width,
                    y: Math.random() * starsCanvas.height,
                    radius: Math.random() * 1.5 + 0.5,
                    alpha: Math.random(),
                    speed: Math.random() * 0.015 + 0.005,
                    color: Math.random() > 0.3 ? '#ffffff' : '#fbcfe8'
                });
            }
        }

        function drawStars() {
            starsCtx.clearRect(0, 0, starsCanvas.width, starsCanvas.height);
            
            stars.forEach(star => {
                star.alpha += star.speed;
                if (star.alpha > 1 || star.alpha < 0) {
                    star.speed = -star.speed;
                }

                starsCtx.save();
                starsCtx.globalAlpha = Math.max(0, Math.min(1, star.alpha));
                starsCtx.fillStyle = star.color;
                starsCtx.beginPath();
                starsCtx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                starsCtx.fill();
                starsCtx.restore();
            });

            requestAnimationFrame(drawStars);
        }

        const particlesCanvas = document.getElementById('petalParticles');
        const particlesCtx = particlesCanvas.getContext('2d');

        let particles = [];

        class MagicParticle {
            constructor(x, y, isBurst = false) {
                this.x = x || Math.random() * particlesCanvas.width;
                this.y = y || (isBurst ? particlesCanvas.height / 2 : particlesCanvas.height + 10);
                this.size = Math.random() * 4 + 2;
                
                if (isBurst) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 5 + 2;
                    this.speedX = Math.cos(angle) * speed;
                    this.speedY = Math.sin(angle) * speed;
                } else {
                    this.speedX = Math.random() * 1.5 - 0.75;
                    this.speedY = -(Math.random() * 1.5 + 0.5);
                }

                this.color = ['#f472b6', '#fbcfe8', '#f43f5e', '#e879f9', '#ffffff'][Math.floor(Math.random() * 5)];
                this.opacity = Math.random() * 0.8 + 0.2;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.05;
                this.life = isBurst ? 100 : 300;
                this.maxLife = this.life;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.rotation += this.rotationSpeed;
                this.life--;

                if (!isActivated) {
                    // Movimiento suave normal
                    this.speedX += (Math.random() - 0.5) * 0.1;
                } else {
                    // Con viento
                    this.speedX += 0.05; 
                }

                if (this.life < 50) {
                    this.opacity = (this.life / 50) * 0.8;
                }
            }

            draw() {
                particlesCtx.save();
                particlesCtx.translate(this.x, this.y);
                particlesCtx.rotate(this.rotation);
                particlesCtx.globalAlpha = Math.max(0, this.opacity);
                particlesCtx.fillStyle = this.color;

                // Forma de pequeños pétalos ovales o destellos
                particlesCtx.beginPath();
                particlesCtx.ellipse(0, 0, this.size, this.size * 1.8, 0, 0, Math.PI * 2);
                particlesCtx.fill();

                particlesCtx.restore();
            }
        }

        function createPetalBurst() {
            const rect = flowerContainer.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 3;

            for (let i = 0; i < 60; i++) {
                particles.push(new MagicParticle(centerX, centerY, true));
            }
        }

        function handleParticles() {
            // Añadir partículas ambientales continuas
            if (Math.random() < (isActivated ? 0.3 : 0.1)) {
                particles.push(new MagicParticle());
            }

            particlesCtx.clearRect(0, 0, particlesCanvas.width, particlesCanvas.height);

            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();

                if (particles[i].life <= 0 || particles[i].y < -20 || particles[i].x > particlesCanvas.width + 20) {
                    particles.splice(i, 1);
                    i--;
                }
            }

            requestAnimationFrame(handleParticles);
        }

        window.onload = function() {
            resizeCanvas();
            drawStars();
            handleParticles();
        };

        window.addEventListener('resize', resizeCanvas);
    </script>
</body>
</html>
